<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intrusion</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* The whole level fits the viewport (canvas sized in JS); never scroll. */
        overflow: hidden;
        background: #0b0b0b;
        color: #cfcfcf;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        /* Taps are game input (§11.6): no pan/pinch/double-tap-zoom gestures, no
           text selection or tap flash — the shell consumes pointerdown itself. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }
      canvas {
        /* Sized to fit the viewport by the shell; block so it doesn't add
           inline-baseline whitespace that could nudge the page into scrolling. */
        display: block;
      }
      /* Seed sharing (§13.1/#110): a small bar overlaying the top-left corner that
         shows the run seed and loads another. Fixed, so it never affects the canvas
         fit; the shell keeps its taps and keystrokes off the game (crates/web/src/
         seed.rs). Values are its own palette echo of §11.2 (Owned blue, slate). */
      #seedbar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #a8a8a8;
        background: rgba(11, 11, 11, 0.72);
        border-bottom-right-radius: 6px;
        /* The bar is UI, not the board: allow its own touch behaviour (the shell
           also stops these events reaching the game's document listeners). */
        touch-action: auto;
      }
      #seedbar .lbl {
        color: #667a8a;
      }
      /* The seed value is selectable so it can be copied (#110: readable/copyable),
         unlike the rest of the page which suppresses selection for touch input. */
      #seed-value {
        color: #4ea6ff;
        user-select: text;
        -webkit-user-select: text;
      }
      #seedbar input {
        width: 8ch;
        padding: 1px 4px;
        font: inherit;
        color: #e8e8e8;
        background: #1e1e1e;
        border: 1px solid #434343;
        border-radius: 3px;
      }
      #seedbar button {
        font: inherit;
        color: #0b0b0b;
        background: #4ea6ff;
        border: 0;
        border-radius: 3px;
        padding: 1px 8px;
        cursor: pointer;
      }
      /* HIDDEN FOR NOW: the bar sat over the board's top-left. Until it has a home
         that doesn't cover play, seeds come from the build (a seed-locked artifact,
         assemble.py --seed) or the URL (`?seed=N` / `#seed=N` on the Pages deploy),
         not this box. The wiring above stays live, so re-enabling the bar is
         deleting just this one rule. */
      #seedbar {
        display: none;
      }
      /* Replay viewer HUD (§12.4/#197): a small bar centred at the bottom edge that
         reads the scrub position (K / total) and marks the run as a replay, not live
         play. Hidden until the shell boots into a replay (crates/web/src/replay.rs
         adds `.on`). It is a pure indicator: pointer-events:none so a tap on it still
         passes through to the scrub surface underneath — the whole screen scrubs. */
      #replaybar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: none;
        align-items: baseline;
        gap: 8px;
        padding: 4px 12px;
        font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #a8a8a8;
        background: rgba(11, 11, 11, 0.72);
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        pointer-events: none;
      }
      #replaybar.on {
        display: flex;
      }
      #replaybar .lbl {
        color: #bd6bd6;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #replay-pos {
        color: #4ea6ff;
      }
      #replaybar .hint {
        color: #667a8a;
      }
    </style>
  </head>
  <body>
    <!--
      Seed sharing (§13.1/#110): the run's seed, and a box to load another. Wired by
      crates/web/src/seed.rs — it fills #seed-value, and reads #seed-input on the
      button or Enter. Every element is optional to the shell, so the game still
      boots if this markup is absent.
    -->
    <div id="seedbar">
      <span class="lbl">seed</span>
      <span id="seed-value">…</span>
      <input
        id="seed-input"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
        placeholder="load…"
        aria-label="Load a seed"
      />
      <button id="seed-go" type="button">play</button>
    </div>
    <!--
      Replay viewer HUD (§12.4/#197): the scrub position and a "replay" marker,
      revealed by crates/web/src/replay.rs only when the shell boots into a replay
      (a baked window.__intrusionReplay or an `inputs=` in the URL). Optional to the
      shell like the seed bar — a page without it still plays the replay, just with
      no on-screen counter.
    -->
    <div id="replaybar" aria-live="polite">
      <span class="lbl">replay</span>
      <span id="replay-pos">0 / 0</span>
      <span class="hint">tap / → step · swipe ⇄ scrub</span>
    </div>
    <div id="app">
      <!--
        The wasm module (built from crates/web via wasm-bindgen) mounts its
        canvas2d glyph grid (§11.1) here. The build step emits intrusion_web.js
        (the ES-module glue) and intrusion_web_bg.wasm alongside this file.
      -->
      <noscript>Intrusion needs JavaScript and WebAssembly.</noscript>
    </div>
    <script type="module">
      import init, { start } from "./intrusion_web.js";
      init().then(start);
    </script>
  </body>
</html>
