<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intrusion</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* The whole level fits the viewport (canvas sized in JS); never scroll. */
        overflow: hidden;
        /* Values are the palette's own, injected at boot (§11.2/#546 —
           crates/web/src/palette.rs::chrome_css is the single owner). The two
           fallbacks cover only the instant before the wasm loads. */
        background: var(--chrome-page, #000);
        color: var(--chrome-text, #888);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        /* Taps are game input (§11.6): no pan/pinch/double-tap-zoom gestures, no
           text selection or tap flash — the shell consumes pointerdown itself. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The page around the board follows the board's own theme (§11.2/#189). The
         canvas keeps its aspect, so there is always a letterbox beside or beneath
         it, and that strip is CSS rather than anything the shell paints — left
         alone, a light board sat in a black frame, the one part of the screen still
         wearing the other theme. The shell mirrors the live theme onto
         `<body data-theme>` on every frame (crates/web/src/lib.rs); dark is the
         default above, so only the light case is stated here. */
      /* No light-theme overrides here: the boot-injected block re-assigns every
         --chrome-… variable under body[data-theme="light"], so the flip is the
         palette's, stated once (§11.2/#546). */
      #app {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }
      canvas {
        /* Sized to fit the viewport by the shell; block so it doesn't add
           inline-baseline whitespace that could nudge the page into scrolling. */
        display: block;
      }
      /* Replay viewer HUD (§12.4/#197): a small bar centred at the bottom edge that
         reads the scrub position (K / total) and marks the run as a replay, not live
         play. Hidden until the shell boots into a replay (crates/web/src/replay.rs
         adds `.on`). It is a pure indicator: pointer-events:none so a tap on it still
         passes through to the scrub surface underneath — the whole screen scrubs. */
      #replaybar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: none;
        align-items: baseline;
        gap: 8px;
        padding: 4px 12px;
        font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--chrome-text);
        background: color-mix(in srgb, var(--chrome-page) 72%, transparent);
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        pointer-events: none;
      }
      #replaybar.on {
        display: flex;
      }
      #replaybar .lbl {
        color: var(--chrome-label);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #replay-pos {
        color: var(--chrome-accent);
      }
      #replaybar .hint {
        color: var(--chrome-hint);
      }
    </style>
  </head>
  <body>
    <!--
      Replay viewer HUD (§12.4/#197): the scrub position and a "replay" marker,
      revealed by crates/web/src/replay.rs only when the shell boots into a replay
      (a baked window.__intrusionReplay or an `inputs=` in the URL). Optional to the
      shell — a page without it still plays the replay, just with no on-screen
      counter. It is the page's **only** element beside the canvas host (#572), and
      it is an indicator rather than a control: nothing here is interactive, which is
      what `crates/web/src/menu.rs::the_page_carries_no_dom_ui` pins.
    -->
    <div id="replaybar" aria-live="polite">
      <span class="lbl">replay</span>
      <span id="replay-pos">0 / 0</span>
      <span class="hint">tap / → step · swipe ⇄ scrub</span>
    </div>
    <div id="app">
      <!--
        The wasm module (built from crates/web via wasm-bindgen) mounts its
        canvas2d glyph grid (§11.1) here. The build step emits intrusion_web.js
        (the ES-module glue) and intrusion_web_bg.wasm alongside this file.
      -->
      <noscript>Intrusion needs JavaScript and WebAssembly.</noscript>
    </div>
    <script type="module">
      import init, { start } from "./intrusion_web.js";
      init().then(start);
    </script>
  </body>
</html>
