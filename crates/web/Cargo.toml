[package]
name = "intrusion-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin wasm-bindgen + canvas2d shell for Intrusion. Renders and feeds input to the pure core."

[lib]
# wasm-bindgen needs a cdylib to produce a wasm module; keep an rlib too so the
# native gate (`cargo test/clippy --workspace`) can still compile and lint it.
crate-type = ["cdylib", "rlib"]

# There is deliberately **no feature list** (#478). The input recorder and the
# help panel's `replay [r]` control were a `debug-tools` feature (#411), off in the
# Pages deploy, from when the control sat on a tab every player could see. The
# Debug tab is the gate now (#459), so the feature was asking "was this build made
# for previewing?" when the live question is "is this a debug session?" — and once
# the deploy wanted it too, the axis had one setting everywhere and was no longer
# a switch. The recorder ships in every build; `ScreenUi::debug_mode` decides
# whether anything can reach it.

[dependencies]
intrusion-core = { path = "../core" }
wasm-bindgen = "=0.2.100"

# web-sys/js-sys are the raw DOM + canvas2d bindings the thin shell draws
# through. Pinned to the versions that pair with wasm-bindgen 0.2.100 so the
# glue never drifts (§12.4 determinism applies to the build, not just the game).
js-sys = "=0.3.77"

[dependencies.web-sys]
version = "=0.3.77"
features = [
    "Window",
    "Document",
    "Element",
    "DomRect",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    # Seed sharing (§13.1/#110): the menu's seed box reads its value, and the
    # active seed is read from / reflected into the page URL as `…#seed=N`.
    "HtmlInputElement",
    "Location",
    # The debug session's URL activation (§12.6/#459): `?debug=intruded` is stripped
    # from the address bar the moment it is consumed, through `history.replaceState`,
    # so the reflected `…#seed=` link a player copies never carries the activation.
    "History",
    # The title screen (#268): the seed box is the one piece of DOM chrome, so the
    # shell tests where a press landed inside it (`Node`) and publishes the board's
    # glyph size to the stylesheet as a custom property (`HtmlElement`'s inline
    # style), which is what keeps the form typeset at the board's own size.
    "Node",
    "HtmlElement",
    "CssStyleDeclaration",
    # The usable line's move/wait hint (§11.6/#323) opens in the device's own input
    # modality, seeded from the `pointer: coarse` media query before the player has
    # touched anything.
    "MediaQueryList",
    # The help panel's `copy [c]` control (§13.1/#353): the level-seed token goes to
    # the system clipboard through `navigator.clipboard`. Only `Navigator` is named —
    # the clipboard itself is reached by property lookup, because whether it is there
    # at all is the question (see `clipboard`).
    "Navigator",
]
